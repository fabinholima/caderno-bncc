services:
  - type: web
    name: ufaprova-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    preDeployCommand: node migrate.mjs && node seed-from-backup.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8788"
      - key: DATABASE_URL
        fromDatabase:
          name: ufaprova-postgres
          property: connectionString
      - key: DEV_AUTH_BYPASS
        value: "false"
      - key: CORS_ORIGIN
        sync: false
      - key: QR_SIGNING_SECRET
        generateValue: true
      - key: FILE_STORAGE_DIR
        value: /var/data/files
      - key: FILE_STORAGE_PROVIDER
        value: s3
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_PREFIX
        value: caderno
      - key: OBJECT_STORAGE_REGION
        value: auto
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_FORCE_PATH_STYLE
        value: "true"
      - key: OBJECT_STORAGE_SSE
        value: ""
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: RENDER_OUTPUT_DIR
        value: /var/data/renders
      - key: TEXMFCACHE
        value: /var/data/tex-cache
    disk:
      name: ufaprova-api-files
      mountPath: /var/data
      sizeGB: 10

  - type: web
    name: ufaprova-frontend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start -- --ip 0.0.0.0 --port $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: worker
    name: ufaprova-renderer
    runtime: docker
    dockerfilePath: ./services/renderer/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ufaprova-postgres
          property: connectionString
      - key: RENDER_OUTPUT_DIR
        value: /var/data/renders
      - key: TEXMFCACHE
        value: /var/data/tex-cache
      - key: CONTEXT_BIN
        value: /opt/context/tex/texmf-linux-64/bin/mtxrun
      - key: CONTEXT_VIA_MTXRUN
        value: "true"
      - key: FILE_STORAGE_PROVIDER
        value: s3
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_PREFIX
        value: caderno
      - key: OBJECT_STORAGE_REGION
        value: auto
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_FORCE_PATH_STYLE
        value: "true"
      - key: OBJECT_STORAGE_SSE
        value: ""
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
    disk:
      name: ufaprova-render-files
      mountPath: /var/data
      sizeGB: 10

  - type: worker
    name: ufaprova-imports
    runtime: node
    rootDir: services/api
    buildCommand: npm install --omit=dev
    startCommand: node exam-import-worker.mjs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ufaprova-postgres
          property: connectionString
      - key: DEV_AUTH_BYPASS
        value: "false"

  - type: worker
    name: ufaprova-omr
    runtime: docker
    dockerfilePath: ./services/omr/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ufaprova-postgres
          property: connectionString
      - key: OMR_PYTHON
        value: /opt/venv-omr/bin/python

databases:
  - name: ufaprova-postgres
    plan: basic-256mb
    databaseName: caderno
    user: caderno
