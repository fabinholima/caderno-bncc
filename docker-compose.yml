services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: caderno
      POSTGRES_USER: caderno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - caderno_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U caderno -d caderno']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 120s

  # Aplica todas as migrações de database/ com o mesmo migrate.mjs da produção
  # (registradas em schema_migrations). Usa as dependências do estágio `deps`
  # do Dockerfile da API, instaladas pelo pnpm-lock.yaml.
  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: deps
    working_dir: /src/services/api
    command: ['node', 'migrate.mjs']
    environment:
      DATABASE_URL: postgresql://caderno:${POSTGRES_PASSWORD}@postgres:5432/caderno
    volumes:
      - ./services/api/migrate.mjs:/src/services/api/migrate.mjs:ro
      - ./database:/src/database:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  caderno_pgdata:
